<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大鱼吃小鱼 - Qwen Version</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1628;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer { position: relative; max-width: 100vw; max-height: 100vh; }
        canvas {
            border: 3px solid #1a3a5c;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 100, 200, 0.3);
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            transition: border-color 0.15s;
        }
        canvas.shake { animation: shakeAnim 0.4s ease-out; border-color: #ef5350 !important; }
        canvas.shield-border { border-color: #4fc3f7 !important; box-shadow: 0 0 40px rgba(79, 195, 247, 0.6); }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px) translateY(3px); }
            20% { transform: translateX(8px) translateY(-3px); }
            30% { transform: translateX(-6px) translateY(2px); }
            40% { transform: translateX(6px) translateY(-2px); }
            50% { transform: translateX(-4px) translateY(1px); }
            60% { transform: translateX(4px) translateY(-1px); }
            70% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
        }
        #ui {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #ui div { margin-bottom: 5px; }
        #stageDisplay {
            font-weight: bold;
            transition: color 0.3s;
        }
        #powerupBar {
            position: absolute; top: 130px; left: 10px;
            pointer-events: none;
        }
        .powerup-indicator {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #comboDisplay {
            position: absolute; top: 10px; right: 15px;
            font-size: 28px; font-weight: bold;
            color: #ffd54f;
            text-shadow: 0 0 10px rgba(255, 213, 79, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: scale(0.8);
        }
        #comboDisplay.active { opacity: 1; transform: scale(1); }
        #startScreen, #gameOverScreen, #pauseOverlay, #countdownOverlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(10, 22, 40, 0.85);
            color: #fff; border-radius: 8px;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 48px; margin-bottom: 20px;
            color: #4fc3f7;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        #startScreen p, #gameOverScreen p {
            font-size: 18px; margin-bottom: 10px; color: #b0bec5;
        }
        .btn {
            margin-top: 20px; padding: 12px 40px; font-size: 20px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            border: none; border-radius: 25px; color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        #finalScore { font-size: 36px; color: #ffd54f; margin: 10px 0; }
        #pauseOverlay h1 { font-size: 42px; color: #4fc3f7; }
        #pauseOverlay p { font-size: 18px; color: #b0bec5; margin-top: 10px; }
        #countdownOverlay {
            background: rgba(10, 22, 40, 0.6);
            font-size: 120px; font-weight: bold;
            color: #4fc3f7;
            text-shadow: 0 0 40px rgba(79, 195, 247, 0.6);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div>🐟 分数: <span id="score">0</span></div>
            <div>📏 阶段: <span id="stageDisplay">🐟 小鱼</span></div>
            <div>🐠 吃掉: <span id="eaten">0</span> 条鱼</div>
            <div>🏆 最高: <span id="highScoreDisplay">0</span></div>
        </div>
        <div id="powerupBar"></div>
        <div id="comboDisplay"></div>
        <div id="startScreen">
            <h1>🐟 大鱼吃小鱼 🐟</h1>
            <p>用鼠标/触屏或方向键控制你的鱼</p>
            <p>吃掉比你小的鱼来长大</p>
            <p>躲开比你大的鱼，否则会被吃掉！</p>
            <p style="color:#66bb6a">💚 绿色光晕 = 可以吃</p>
            <p style="color:#ef5350">❤️ 红色光晕 = 危险！快跑</p>
            <p style="color:#ffd54f">⭐ 金鱼 = 超高分值</p>
            <p style="color:#ff5722">💣 炸弹鱼 = 碰到就炸！</p>
            <p style="color:#4fc3f7">🛡️ 护盾道具 = 短暂无敌</p>
            <p style="color:#ab47bc">⚡ 加速道具 = 速度暴增</p>
            <p style="color:#ffd54f">⚡ 快速连吃获得 Combo 加分！</p>
            <button class="btn" onclick="beginCountdown()">开始游戏</button>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>游戏结束</h1>
            <p id="gameOverReason">你被更大的鱼吃掉了！</p>
            <div id="finalScore">0</div>
            <p>最终得分</p>
            <p id="finalCombo" style="color:#ffd54f"></p>
            <p id="newHighScore" class="hidden" style="color:#ffd54f;font-size:22px">🎉 新纪录！</p>
            <button class="btn" onclick="beginCountdown()">再来一次</button>
        </div>
        <div id="pauseOverlay" class="hidden">
            <h1>⏸️ 暂停中</h1>
            <p>按 P 或 Esc 继续游戏</p>
        </div>
        <div id="countdownOverlay" class="hidden">3</div>
    </div>

    <script>
        // ========== CONFIG ==========
        const CONFIG = {
            CANVAS_W: 900, CANVAS_H: 600,
            // 玩家
            PLAYER_INIT_SIZE: 20, PLAYER_INIT_SPEED: 3,
            PLAYER_FRICTION: 0.92, PLAYER_ACCEL_MOUSE: 0.3, PLAYER_ACCEL_KEY: 0.4,
            PLAYER_GROWTH_RATE: 0.05, PLAYER_SPEED_PER_SIZE: 0.02,
            // 碰撞
            EAT_THRESHOLD: 1.1,
            COLLISION_PLAYER_FACTOR: 0.7, COLLISION_FISH_FACTOR: 0.5,
            // AI鱼
            FISH_BASE_COUNT: 15, FISH_PER_SIZE: 5, FISH_INIT_COUNT: 20,
            FISH_SPEED_MIN: 0.5, FISH_SPEED_MAX: 2.5, FISH_SPEED_LIMIT_MULT: 2,
            FISH_BIG_SLOW_MULT: 0.7, FISH_BIG_SLOW_THRESHOLD: 1.5,
            FISH_SMALL_RATIO: 0.5, FISH_SIMILAR_RATIO: 0.85,
            FISH_DIR_CHANGE_MIN: 100, FISH_DIR_CHANGE_MAX: 300,
            FISH_AI_RANGE: 150, FISH_FLEE_FORCE: 0.15, FISH_CHASE_FORCE: 0.08,
            FISH_FLEE_THRESHOLD: 0.8, FISH_CHASE_THRESHOLD: 1.2,
            FISH_OFFSCREEN_MARGIN: 100, FISH_MIN_SIZE: 5,
            FISH_SMALL_SIZE_MIN: 0.2, FISH_SMALL_SIZE_MAX: 0.9,
            FISH_SIMILAR_SIZE_MIN: 0.8, FISH_SIMILAR_SIZE_MAX: 1.2,
            FISH_BIG_SIZE_MIN: 1.2, FISH_BIG_SIZE_MAX: 2.0,
            FISH_AI_EAT_THRESHOLD: 1.1, FISH_AI_COLLISION_FACTOR: 0.6, FISH_AI_EAT_GROWTH: 0.1,
            // 特殊鱼类
            GOLDEN_FISH_CHANCE: 0.05,   // 5% 概率生成金鱼
            GOLDEN_FISH_SCORE_MULT: 5,   // 金鱼分数倍率
            GOLDEN_FISH_COLOR: '#ffd54f',
            GOLDEN_FISH_SPEED_MULT: 1.5, // 金鱼更快
            BOMB_FISH_CHANCE: 0.03,      // 3% 概率生成炸弹鱼
            BOMB_FISH_COLOR: '#ff5722',
            BOMB_FISH_MIN_SIZE: 12,
            BOMB_FISH_MAX_SIZE: 18,
            BOMB_EXPLOSION_RADIUS: 80,   // 炸弹爆炸范围
            BOMB_PARTICLE_COUNT: 20,
            // 鱼群行为
            SCHOOL_CHANCE: 0.3,          // 30% 概率生成鱼群
            SCHOOL_SIZE: 4,              // 鱼群数量
            SCHOOL_SPREAD: 40,           // 鱼群散布范围
            // 道具系统
            POWERUP_SPAWN_INTERVAL: 600, // 每600帧(~10秒)生成一个道具
            POWERUP_SIZE: 12,
            POWERUP_SPEED: 0.5,
            POWERUP_LIFETIME: 900,       // 道具存在帧数(~15秒)
            SHIELD_DURATION: 300,        // 护盾持续帧数(5秒)
            SPEED_BOOST_DURATION: 240,   // 加速持续帧数(4秒)
            SPEED_BOOST_MULT: 2.0,       // 加速倍率
            MAGNET_DURATION: 360,        // 磁铁持续帧数(6秒)
            MAGNET_RANGE: 150,           // 磁铁吸引范围
            MAGNET_FORCE: 0.3,           // 磁铁吸引力
            // 难度递进
            DIFFICULTY_INTERVAL: 30,     // 每30秒提升一级难度
            DIFFICULTY_MAX: 10,
            DIFFICULTY_FISH_SPEED_INC: 0.1, // 每级难度鱼速度增加
            DIFFICULTY_BIG_FISH_INC: 0.02,  // 每级大的生成概率增加
            DIFFICULTY_BOMB_INC: 0.005,     // 每级炸弹鱼概率增加
            // 成长阶段
            STAGE_SMALL: 20,   // < 20: 小鱼
            STAGE_MEDIUM: 40,  // 20-40: 中鱼
            STAGE_LARGE: 70,   // 40-70: 大鱼
            STAGE_GIANT: 120,  // > 120: 巨型鱼
            // 分数 & Combo
            SCORE_PER_SIZE: 10,
            COMBO_WINDOW_MS: 2000, COMBO_MULTIPLIER_STEP: 0.5, COMBO_MAX: 10,
            // 分数弹出
            SCORE_POPUP_DURATION: 60, SCORE_POPUP_RISE_SPEED: 1.5, SCORE_POPUP_FADE: 0.018,
            // 气泡
            BUBBLE_SPAWN_CHANCE: 0.02, BUBBLE_SIZE_MIN: 2, BUBBLE_SIZE_RANGE: 5,
            BUBBLE_SPEED_MIN: 0.3, BUBBLE_SPEED_RANGE: 0.7,
            // 粒子
            EAT_PARTICLE_COUNT: 8, PARTICLE_FADE_RATE: 0.02, PARTICLE_SHRINK: 0.98,
            PARTICLE_SIZE_MIN: 2, PARTICLE_SIZE_RANGE: 3, PARTICLE_SPEED_RANGE: 2,
            // 视觉
            SIZE_INDICATOR_RANGE: 250,
            INDICATOR_GREEN: 'rgba(102, 187, 106, 0.25)', INDICATOR_RED: 'rgba(239, 83, 80, 0.25)',
            INDICATOR_STROKE_GREEN: 'rgba(102, 187, 106, 0.8)', INDICATOR_STROKE_RED: 'rgba(239, 83, 80, 0.8)',
            INDICATOR_GOLD: 'rgba(255, 213, 79, 0.3)', INDICATOR_STROKE_GOLD: 'rgba(255, 213, 79, 0.8)',
            // 帧率
            TARGET_FRAME_MS: 1000 / 60,
            // 鱼外观
            TAIL_WAGGLE_SPEED: 0.1, TAIL_WAGGLE_AMP: 0.3,
            DIR_THRESHOLD: 0.1, MOUSE_DEAD_ZONE: 5,
            FISH_PATTERN_SIZE_THRESHOLD: 25, FISH_PATTERN_BIG_THRESHOLD: 45,
            // 海藻
            SEAWEED_COUNT: 8, SEAWEED_SPACING: 120, SEAWEED_START_X: 60,
            SEAWEED_SEGMENTS: 5, SEAWEED_SEG_HEIGHT: 30,
            // 光线
            LIGHT_RAY_COUNT: 5, LIGHT_RAY_SPACING: 180,
            LIGHT_RAY_START: 150, LIGHT_RAY_OFFSET: 50,
            // 倒计时
            COUNTDOWN_SECONDS: 3, COUNTDOWN_MS: 1000,
            MENU_FISH_COUNT: 12
        };

        // ========== 初始化 ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = CONFIG.CANVAS_W;
        const H = CONFIG.CANVAS_H;

        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = W; bgCanvas.height = H;
        const bgCtx = bgCanvas.getContext('2d');

        const DOM = {
            score: document.getElementById('score'),
            size: document.getElementById('stageDisplay'),
            eaten: document.getElementById('eaten'),
            finalScore: document.getElementById('finalScore'),
            finalCombo: document.getElementById('finalCombo'),
            gameOverReason: document.getElementById('gameOverReason'),
            highScoreDisplay: document.getElementById('highScoreDisplay'),
            startScreen: document.getElementById('startScreen'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            pauseOverlay: document.getElementById('pauseOverlay'),
            countdownOverlay: document.getElementById('countdownOverlay'),
            newHighScore: document.getElementById('newHighScore'),
            comboDisplay: document.getElementById('comboDisplay'),
            powerupBar: document.getElementById('powerupBar')
        };

        // ========== Web Audio 音效系统 ==========
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                switch (type) {
                    case 'eat':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                        break;
                    case 'golden':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                        osc.frequency.exponentialRampToValueAtTime(1600, now + 0.2);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                    case 'bomb':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4);
                        break;
                    case 'powerup':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.25);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                    case 'combo':
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                        break;
                    case 'gameover':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                        osc.start(now); osc.stop(now + 0.7);
                        break;
                    case 'countdown':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                        break;
                    case 'go':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, now);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                        break;
                }
            } catch (e) { /* 音效失败不影响游戏 */ }
        }

        // ========== 工具函数 ==========
        function hexToRgb(hex) {
            return {
                r: parseInt(hex.substr(1, 2), 16),
                g: parseInt(hex.substr(3, 2), 16),
                b: parseInt(hex.substr(5, 2), 16)
            };
        }

        function toCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (W / rect.width),
                y: (clientY - rect.top) * (H / rect.height)
            };
        }

        function distance(x1, y1, x2, y2) {
            const dx = x1 - x2, dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ========== 游戏状态 ==========
        let gameState = 'start';
        let score = 0, fishEaten = 0;
        let highScore = parseInt(localStorage.getItem('bigFishHighScore')) || 0;
        let animFrame, lastTime = 0, maxCombo = 0;
        let gameStartTime = 0; // 用于难度递进
        let difficulty = 0;
        let powerupSpawnTimer = 0;
        let countdownInterval = null; // 防止倒计时重入
        DOM.highScoreDisplay.textContent = highScore;

        // Combo
        let combo = 0, lastEatTime = 0, comboTimeout = null;

        // 道具状态
        let shieldTimer = 0;
        let speedBoostTimer = 0;
        let magnetTimer = 0;

        let scorePopups = [];
        let menuFishes = [];

        let player = {
            x: W / 2, y: H / 2,
            size: CONFIG.PLAYER_INIT_SIZE,
            speed: CONFIG.PLAYER_INIT_SPEED,
            vx: 0, vy: 0,
            color: '#4fc3f7',
            tailAngle: 0, direction: 1
        };

        let fishes = [];
        let bubbles = [];
        let particles = [];
        let powerups = []; // 道具数组

        let keys = {};
        let mouseX = W / 2, mouseY = H / 2;
        let useMouseControl = false;

        const fishColors = [
            '#ff7043', '#ff8a65', '#ffab91', '#66bb6a', '#81c784', '#a5d6a7',
            '#ffa726', '#ffb74d', '#ffcc80', '#ef5350', '#e57373', '#ef9a9a',
            '#ab47bc', '#ba68c8', '#ce93d8', '#42a5f5', '#64b5f6', '#90caf9',
            '#ffee58', '#fff176', '#fff59d',
        ];

        // ========== 成长阶段 ==========
        function getStage(size) {
            if (size < CONFIG.STAGE_SMALL) return { name: '🐟 小鱼', color: '#90caf9', level: 0 };
            if (size < CONFIG.STAGE_MEDIUM) return { name: '🐠 中鱼', color: '#66bb6a', level: 1 };
            if (size < CONFIG.STAGE_LARGE) return { name: '🐡 大鱼', color: '#ffa726', level: 2 };
            return { name: '🦈 巨型鱼', color: '#ef5350', level: 3 };
        }

        function updateStageDisplay() {
            let stage = getStage(player.size);
            DOM.size.textContent = stage.name;
            DOM.size.style.color = stage.color;
        }

        // ========== 难度系统 ==========
        function updateDifficulty() {
            if (gameState !== 'playing') return;
            let elapsed = (performance.now() - gameStartTime) / 1000;
            difficulty = Math.min(Math.floor(elapsed / CONFIG.DIFFICULTY_INTERVAL), CONFIG.DIFFICULTY_MAX);
        }

        // ========== 输入 ==========
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            useMouseControl = false;
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (gameState === 'playing') pauseGame();
                else if (gameState === 'paused') resumeGame();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        canvas.addEventListener('mousemove', (e) => {
            const pos = toCanvasCoords(e.clientX, e.clientY);
            mouseX = pos.x; mouseY = pos.y;
            useMouseControl = true;
        });

        function handleTouch(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                const pos = toCanvasCoords(e.touches[0].clientX, e.touches[0].clientY);
                mouseX = pos.x; mouseY = pos.y;
                useMouseControl = true;
            }
        }
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        // ========== 暂停/恢复 ==========
        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            DOM.pauseOverlay.classList.remove('hidden');
            if (animFrame) cancelAnimationFrame(animFrame);
        }

        function resumeGame() {
            if (gameState !== 'paused') return;
            gameState = 'playing';
            DOM.pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            animFrame = requestAnimationFrame(gameLoop);
        }

        // ========== 倒计时 ==========
        function beginCountdown() {
            // 防止重入：取消之前的倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            if (animFrame) {
                cancelAnimationFrame(animFrame);
                animFrame = null;
            }
            if (comboTimeout) {
                clearTimeout(comboTimeout);
                comboTimeout = null;
            }

            initAudio();
            DOM.startScreen.classList.add('hidden');
            DOM.gameOverScreen.classList.add('hidden');
            DOM.countdownOverlay.classList.remove('hidden');
            DOM.comboDisplay.classList.remove('active');
            canvas.classList.remove('shield-border');
            gameState = 'countdown';
            menuFishes = [];

            score = 0; fishEaten = 0; maxCombo = 0;
            combo = 0; lastEatTime = 0;
            shieldTimer = 0; speedBoostTimer = 0; magnetTimer = 0;
            powerupSpawnTimer = CONFIG.POWERUP_SPAWN_INTERVAL; // 不要立即生成道具
            fishes = []; bubbles = []; particles = []; scorePopups = []; powerups = [];
            player.x = W / 2; player.y = H / 2;
            player.size = CONFIG.PLAYER_INIT_SIZE;
            player.speed = CONFIG.PLAYER_INIT_SPEED;
            player.vx = 0; player.vy = 0;
            difficulty = 0;

            for (let i = 0; i < CONFIG.FISH_INIT_COUNT; i++) fishes.push(createFish());

            let count = CONFIG.COUNTDOWN_SECONDS;
            DOM.countdownOverlay.textContent = count;
            playSound('countdown');

            function countdownRender() {
                if (gameState !== 'countdown') return;
                drawBackground();
                for (let fish of fishes) drawFish(fish, false);
                drawFish(player, true);
                for (let fish of fishes) {
                    fish.x += fish.vx; fish.y += fish.vy;
                    fish.tailAngle += CONFIG.TAIL_WAGGLE_SPEED;
                    if (fish.x < -50 || fish.x > W + 50 || fish.y < -50 || fish.y > H + 50) {
                        let angle = Math.random() * Math.PI * 2;
                        fish.vx = Math.cos(angle) * fish.speed;
                        fish.vy = Math.sin(angle) * fish.speed;
                    }
                }
                requestAnimationFrame(countdownRender);
            }
            countdownRender();

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    DOM.countdownOverlay.textContent = count;
                    playSound('countdown');
                } else if (count === 0) {
                    DOM.countdownOverlay.textContent = 'GO!';
                    playSound('go');
                } else {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    DOM.countdownOverlay.classList.add('hidden');
                    gameState = 'playing';
                    gameStartTime = performance.now();
                    lastTime = 0;
                    if (animFrame) cancelAnimationFrame(animFrame);
                    animFrame = requestAnimationFrame(gameLoop);
                }
            }, CONFIG.COUNTDOWN_MS);
        }

        // ========== Combo ==========
        function onEatFish(fishSize, fishX, fishY, isGolden) {
            let now = performance.now();
            if (now - lastEatTime < CONFIG.COMBO_WINDOW_MS) {
                combo = Math.min(combo + 1, CONFIG.COMBO_MAX);
            } else {
                combo = 1;
            }
            lastEatTime = now;
            if (combo > maxCombo) maxCombo = combo;

            let baseMult = isGolden ? CONFIG.GOLDEN_FISH_SCORE_MULT : 1;
            let comboMult = 1 + (combo - 1) * CONFIG.COMBO_MULTIPLIER_STEP;
            let points = Math.floor(fishSize * CONFIG.SCORE_PER_SIZE * comboMult * baseMult);
            score += points;
            fishEaten++;

            let text = '+' + points;
            if (isGolden) text += ' ⭐';
            else if (combo > 1) text += ` x${combo}🔥`;

            scorePopups.push({
                x: fishX, y: fishY, text,
                alpha: 1, life: CONFIG.SCORE_POPUP_DURATION,
                color: isGolden ? '#ffd54f' : (combo > 3 ? '#ffd54f' : '#fff')
            });

            if (isGolden) {
                playSound('golden');
            } else if (combo > 1) {
                playSound('combo');
            } else {
                playSound('eat');
            }

            if (combo > 1) {
                DOM.comboDisplay.textContent = `🔥 ${combo}x Combo!`;
                DOM.comboDisplay.classList.add('active');
                DOM.comboDisplay.style.transform = 'scale(1.2)';
                setTimeout(() => { DOM.comboDisplay.style.transform = 'scale(1)'; }, 150);
            }

            if (comboTimeout) clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => {
                combo = 0;
                DOM.comboDisplay.classList.remove('active');
            }, CONFIG.COMBO_WINDOW_MS);
        }

        // ========== 游戏结束 ==========
        function triggerGameOver(reason) {
            if (gameState === 'over') return; // 防止双重触发
            gameState = 'over';
            playSound('gameover');

            // 清理定时器
            if (comboTimeout) {
                clearTimeout(comboTimeout);
                comboTimeout = null;
            }

            // 清理 UI 状态
            canvas.classList.add('shake');
            DOM.comboDisplay.classList.remove('active');

            setTimeout(() => canvas.classList.remove('shake'), 500);
            setTimeout(() => endGame(reason), 500);
        }

        function endGame(reason) {
            DOM.finalScore.textContent = score;
            DOM.gameOverReason.textContent = reason || '你被更大的鱼吃掉了！';
            DOM.finalCombo.textContent = maxCombo > 1 ? `最高连击: ${maxCombo}x` : '';
            DOM.gameOverScreen.classList.remove('hidden');
            DOM.powerupBar.innerHTML = '';
            canvas.classList.remove('shield-border'); // 清理护盾样式
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bigFishHighScore', highScore);
                DOM.highScoreDisplay.textContent = highScore;
                DOM.newHighScore.classList.remove('hidden');
            } else {
                DOM.newHighScore.classList.add('hidden');
            }
        }

        // ========== 创建鱼 ==========
        function createFish(forMenu, schoolPos) {
            let size, type = 'normal';

            if (forMenu) {
                size = 8 + Math.random() * 35;
            } else {
                // 判断特殊鱼类
                let rand = Math.random();
                let bombChance = CONFIG.BOMB_FISH_CHANCE + difficulty * CONFIG.DIFFICULTY_BOMB_INC;

                if (rand < CONFIG.GOLDEN_FISH_CHANCE) {
                    type = 'golden';
                    size = player.size * (0.3 + Math.random() * 0.5);
                } else if (rand < CONFIG.GOLDEN_FISH_CHANCE + bombChance) {
                    type = 'bomb';
                    size = CONFIG.BOMB_FISH_MIN_SIZE + Math.random() * (CONFIG.BOMB_FISH_MAX_SIZE - CONFIG.BOMB_FISH_MIN_SIZE);
                } else {
                    let sizeRand = Math.random();
                    if (sizeRand < CONFIG.FISH_SMALL_RATIO) {
                        size = Math.max(CONFIG.FISH_MIN_SIZE,
                            player.size * (CONFIG.FISH_SMALL_SIZE_MIN + Math.random() * (CONFIG.FISH_SMALL_SIZE_MAX - CONFIG.FISH_SMALL_SIZE_MIN)));
                    } else if (sizeRand < CONFIG.FISH_SIMILAR_RATIO) {
                        size = player.size * (CONFIG.FISH_SIMILAR_SIZE_MIN + Math.random() * (CONFIG.FISH_SIMILAR_SIZE_MAX - CONFIG.FISH_SIMILAR_SIZE_MIN));
                    } else {
                        size = player.size * (CONFIG.FISH_BIG_SIZE_MIN + Math.random() * (CONFIG.FISH_BIG_SIZE_MAX - CONFIG.FISH_BIG_SIZE_MIN));
                        // 难度越高，大鱼越大
                        size *= (1 + difficulty * CONFIG.DIFFICULTY_BIG_FISH_INC);
                    }
                }
            }

            let x, y;
            if (schoolPos) {
                // 鱼群位置
                x = schoolPos.x + (Math.random() - 0.5) * CONFIG.SCHOOL_SPREAD;
                y = schoolPos.y + (Math.random() - 0.5) * CONFIG.SCHOOL_SPREAD;
            } else {
                let side = Math.floor(Math.random() * 4);
                if (side === 0) { x = -size; y = Math.random() * H; }
                else if (side === 1) { x = W + size; y = Math.random() * H; }
                else if (side === 2) { x = Math.random() * W; y = -size; }
                else { x = Math.random() * W; y = H + size; }
            }

            let speed = CONFIG.FISH_SPEED_MIN + Math.random() * (CONFIG.FISH_SPEED_MAX - CONFIG.FISH_SPEED_MIN);
            speed += difficulty * CONFIG.DIFFICULTY_FISH_SPEED_INC;
            if (!forMenu && size > player.size * CONFIG.FISH_BIG_SLOW_THRESHOLD) speed *= CONFIG.FISH_BIG_SLOW_MULT;
            if (type === 'golden') speed *= CONFIG.GOLDEN_FISH_SPEED_MULT;

            let dirX = (W / 2 - x) + (Math.random() - 0.5) * W;
            let dirY = (H / 2 - y) + (Math.random() - 0.5) * H;
            let len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;

            let color;
            if (type === 'golden') color = CONFIG.GOLDEN_FISH_COLOR;
            else if (type === 'bomb') color = CONFIG.BOMB_FISH_COLOR;
            else color = fishColors[Math.floor(Math.random() * fishColors.length)];

            return {
                x, y, size, speed, type, color,
                vx: (dirX / len) * speed,
                vy: (dirY / len) * speed,
                tailAngle: Math.random() * Math.PI * 2,
                direction: dirX > 0 ? 1 : -1,
                changeTimer: CONFIG.FISH_DIR_CHANGE_MIN + Math.random() * (CONFIG.FISH_DIR_CHANGE_MAX - CONFIG.FISH_DIR_CHANGE_MIN)
            };
        }

        function createBubble() {
            return {
                x: Math.random() * W, y: H + 10,
                size: CONFIG.BUBBLE_SIZE_MIN + Math.random() * CONFIG.BUBBLE_SIZE_RANGE,
                speed: CONFIG.BUBBLE_SPEED_MIN + Math.random() * CONFIG.BUBBLE_SPEED_RANGE,
                wobble: Math.random() * Math.PI * 2
            };
        }

        // ========== 道具系统 ==========
        const POWERUP_TYPES = [
            { type: 'shield', emoji: '🛡️', color: '#4fc3f7', label: '护盾' },
            { type: 'speed', emoji: '⚡', color: '#ab47bc', label: '加速' },
            { type: 'magnet', emoji: '🧲', color: '#ff7043', label: '磁铁' }
        ];

        function createPowerup() {
            let typeInfo = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
            let x = Math.random() * W;
            let y = -20;
            return {
                ...typeInfo,
                x, y,
                vy: CONFIG.POWERUP_SPEED,
                wobble: Math.random() * Math.PI * 2,
                lifetime: CONFIG.POWERUP_LIFETIME,
                size: CONFIG.POWERUP_SIZE,
                pulseAngle: Math.random() * Math.PI * 2
            };
        }

        function activatePowerup(powerup) {
            playSound('powerup');
            switch (powerup.type) {
                case 'shield':
                    shieldTimer = CONFIG.SHIELD_DURATION;
                    canvas.classList.add('shield-border');
                    break;
                case 'speed':
                    speedBoostTimer = CONFIG.SPEED_BOOST_DURATION;
                    break;
                case 'magnet':
                    magnetTimer = CONFIG.MAGNET_DURATION;
                    break;
            }
            // 弹出提示
            scorePopups.push({
                x: powerup.x, y: powerup.y,
                text: `${powerup.emoji} ${powerup.label}!`,
                alpha: 1, life: 60,
                color: powerup.color
            });
        }

        function updatePowerupUI() {
            let html = '';
            if (shieldTimer > 0) {
                let sec = Math.ceil(shieldTimer / 60);
                html += `<div class="powerup-indicator" style="background:rgba(79,195,247,0.6)">🛡️ 护盾 ${sec}s</div>`;
            }
            if (speedBoostTimer > 0) {
                let sec = Math.ceil(speedBoostTimer / 60);
                html += `<div class="powerup-indicator" style="background:rgba(171,71,188,0.6)">⚡ 加速 ${sec}s</div>`;
            }
            if (magnetTimer > 0) {
                let sec = Math.ceil(magnetTimer / 60);
                html += `<div class="powerup-indicator" style="background:rgba(255,112,67,0.6)">🧲 磁铁 ${sec}s</div>`;
            }
            DOM.powerupBar.innerHTML = html;
        }

        // ========== 绘制子函数 ==========
        function drawBody(s, color) {
            ctx.beginPath();
            ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            let grad = ctx.createRadialGradient(-s * 0.2, -s * 0.2, 0, 0, 0, s);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function drawFishPattern(s) {
            ctx.save();
            ctx.globalAlpha = 0.2;
            if (s > CONFIG.FISH_PATTERN_BIG_THRESHOLD) {
                ctx.fillStyle = '#000';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(-s * 0.3 + i * s * 0.3, s * 0.1 * (i % 2 ? 1 : -1), s * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (s > CONFIG.FISH_PATTERN_SIZE_THRESHOLD) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    let px = -s * 0.3 + i * s * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(px, -s * 0.35);
                    ctx.lineTo(px, s * 0.35);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawTail(s, color, tailAngle) {
            let tailSwing = Math.sin(tailAngle) * CONFIG.TAIL_WAGGLE_AMP;
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, 0);
            ctx.lineTo(-s * 1.4, -s * 0.5 + tailSwing * s);
            ctx.lineTo(-s * 1.4, s * 0.5 + tailSwing * s);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawFin(s, color) {
            ctx.beginPath();
            ctx.moveTo(-s * 0.2, -s * 0.5);
            ctx.quadraticCurveTo(s * 0.1, -s * 0.9, s * 0.3, -s * 0.5);
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.7;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        function drawEye(s) {
            ctx.beginPath();
            ctx.arc(s * 0.4, -s * 0.1, s * 0.18, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.45, -s * 0.1, s * 0.09, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.47, -s * 0.14, s * 0.04, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function drawPlayerMarker(s) {
            ctx.beginPath();
            ctx.arc(0, -s * 0.9, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd54f';
            ctx.fill();
        }

        /** 绘制金鱼光效 */
        function drawGoldenGlow(s) {
            ctx.save();
            let time = Date.now() / 300;
            ctx.globalAlpha = 0.3 + Math.sin(time) * 0.15;
            ctx.beginPath();
            ctx.arc(0, 0, s * 1.3, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(0, 0, s * 0.5, 0, 0, s * 1.3);
            grad.addColorStop(0, 'rgba(255, 213, 79, 0.4)');
            grad.addColorStop(1, 'rgba(255, 213, 79, 0)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        /** 绘制炸弹鱼标记 */
        function drawBombMark(s) {
            ctx.save();
            ctx.font = `bold ${Math.floor(s * 0.8)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💣', 0, 0);
            ctx.restore();
        }

        /** 绘制护盾光环 */
        function drawShieldAura(s) {
            ctx.save();
            let time = Date.now() / 200;
            ctx.globalAlpha = 0.3 + Math.sin(time) * 0.1;
            ctx.beginPath();
            ctx.arc(0, 0, s * 1.4, 0, Math.PI * 2);
            ctx.strokeStyle = '#4fc3f7';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.lineDashOffset = -time * 3;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        function drawFish(fish, isPlayer) {
            ctx.save();
            ctx.translate(fish.x, fish.y);
            ctx.scale(fish.direction, 1);

            let s = fish.size;
            fish.tailAngle += CONFIG.TAIL_WAGGLE_SPEED;

            // 金鱼光效
            if (fish.type === 'golden') drawGoldenGlow(s);

            drawTail(s, fish.color, fish.tailAngle);
            drawBody(s, fish.color);

            // 普通鱼显示花纹，炸弹鱼和金鱼不显示
            if (fish.type === 'normal') drawFishPattern(s);

            drawFin(s, fish.color);

            // 炸弹鱼显示💣
            if (fish.type === 'bomb') {
                drawBombMark(s);
            } else {
                drawEye(s);
            }

            if (isPlayer) {
                drawPlayerMarker(s);
                // 护盾光环
                if (shieldTimer > 0) drawShieldAura(s);
            }

            ctx.restore();
        }

        // ========== 道具绘制 ==========
        function drawPowerup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            p.pulseAngle += 0.05;
            let pulse = 1 + Math.sin(p.pulseAngle) * 0.15;

            // 光晕
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 1.5 * pulse, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 1.5);
            grad.addColorStop(0, p.color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fill();

            // 道具图标
            ctx.globalAlpha = 1;
            ctx.font = `${Math.floor(p.size * 1.5)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.emoji, 0, 0);

            ctx.restore();
        }

        // ========== 指示器 ==========
        function drawSizeIndicator(fish) {
            let dist = distance(fish.x, fish.y, player.x, player.y);
            if (dist > CONFIG.SIZE_INDICATOR_RANGE) return;
            let alpha = 1 - (dist / CONFIG.SIZE_INDICATOR_RANGE);
            let fillColor, strokeColor;

            if (fish.type === 'golden') {
                fillColor = CONFIG.INDICATOR_GOLD;
                strokeColor = CONFIG.INDICATOR_STROKE_GOLD;
            } else if (fish.type === 'bomb') {
                fillColor = CONFIG.INDICATOR_RED;
                strokeColor = CONFIG.INDICATOR_STROKE_RED;
            } else if (player.size > fish.size * CONFIG.EAT_THRESHOLD) {
                fillColor = CONFIG.INDICATOR_GREEN;
                strokeColor = CONFIG.INDICATOR_STROKE_GREEN;
            } else if (fish.size > player.size * CONFIG.EAT_THRESHOLD) {
                fillColor = CONFIG.INDICATOR_RED;
                strokeColor = CONFIG.INDICATOR_STROKE_RED;
            } else { return; }

            ctx.save();
            ctx.globalAlpha = alpha * 0.6;
            ctx.beginPath();
            ctx.arc(fish.x, fish.y, fish.size + 4, 0, Math.PI * 2);
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.restore();
        }

        // ========== 其他绘制 ==========
        function drawBubble(bubble) {
            ctx.beginPath();
            ctx.arc(bubble.x, bubble.y, bubble.size, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(bubble.x - bubble.size * 0.3, bubble.y - bubble.size * 0.3, bubble.size * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
        }

        function drawParticle(p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
            ctx.fill();
        }

        function drawScorePopups() {
            for (let popup of scorePopups) {
                ctx.save();
                ctx.globalAlpha = popup.alpha;
                ctx.font = 'bold 18px Microsoft YaHei';
                ctx.fillStyle = popup.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(popup.text, popup.x, popup.y);
                ctx.restore();
            }
        }

        function updateScorePopups(dt) {
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                let p = scorePopups[i];
                p.y -= CONFIG.SCORE_POPUP_RISE_SPEED * dt;
                p.life -= dt;
                p.alpha -= CONFIG.SCORE_POPUP_FADE * dt;
                if (p.life <= 0 || p.alpha <= 0) scorePopups.splice(i, 1);
            }
        }

        // ========== 背景 ==========
        function renderStaticBackground() {
            let grad = bgCtx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0d2137');
            grad.addColorStop(0.5, '#0a3d5c');
            grad.addColorStop(1, '#062a3e');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, W, H);
            bgCtx.save();
            bgCtx.globalAlpha = 0.03;
            for (let i = 0; i < CONFIG.LIGHT_RAY_COUNT; i++) {
                bgCtx.beginPath();
                bgCtx.moveTo(CONFIG.LIGHT_RAY_START + i * CONFIG.LIGHT_RAY_SPACING, 0);
                bgCtx.lineTo(CONFIG.LIGHT_RAY_START - CONFIG.LIGHT_RAY_OFFSET + i * CONFIG.LIGHT_RAY_SPACING, H);
                bgCtx.lineTo(CONFIG.LIGHT_RAY_START + CONFIG.LIGHT_RAY_OFFSET + i * CONFIG.LIGHT_RAY_SPACING, H);
                bgCtx.closePath();
                bgCtx.fillStyle = '#4fc3f7';
                bgCtx.fill();
            }
            bgCtx.restore();
        }

        function drawSeaweed() {
            ctx.save();
            ctx.globalAlpha = 0.15;
            let time = Date.now() / 1000;
            for (let i = 0; i < CONFIG.SEAWEED_COUNT; i++) {
                let baseX = CONFIG.SEAWEED_START_X + i * CONFIG.SEAWEED_SPACING;
                ctx.beginPath();
                ctx.moveTo(baseX, H);
                for (let j = 0; j < CONFIG.SEAWEED_SEGMENTS; j++) {
                    ctx.lineTo(baseX + Math.sin(time + i + j * 0.5) * 10, H - j * CONFIG.SEAWEED_SEG_HEIGHT);
                }
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawBackground() {
            ctx.drawImage(bgCanvas, 0, 0);
            drawSeaweed();
        }

        function createEatParticles(x, y, color) {
            let rgb = hexToRgb(color);
            for (let i = 0; i < CONFIG.EAT_PARTICLE_COUNT; i++) {
                let angle = (Math.PI * 2 / CONFIG.EAT_PARTICLE_COUNT) * i;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * (1 + Math.random() * CONFIG.PARTICLE_SPEED_RANGE),
                    vy: Math.sin(angle) * (1 + Math.random() * CONFIG.PARTICLE_SPEED_RANGE),
                    size: CONFIG.PARTICLE_SIZE_MIN + Math.random() * CONFIG.PARTICLE_SIZE_RANGE,
                    alpha: 1, r: rgb.r, g: rgb.g, b: rgb.b
                });
            }
        }

        /** 炸弹爆炸效果 */
        function createBombExplosion(x, y) {
            for (let i = 0; i < CONFIG.BOMB_PARTICLE_COUNT; i++) {
                let angle = (Math.PI * 2 / CONFIG.BOMB_PARTICLE_COUNT) * i;
                let speed = 2 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 5,
                    alpha: 1,
                    r: 255, g: Math.floor(80 + Math.random() * 80), b: 30
                });
            }
        }

        // ========== 更新函数 ==========
        function updatePlayer(dt) {
            let accel = CONFIG.PLAYER_ACCEL_MOUSE;
            let keyAccel = CONFIG.PLAYER_ACCEL_KEY;
            if (speedBoostTimer > 0) {
                accel *= CONFIG.SPEED_BOOST_MULT;
                keyAccel *= CONFIG.SPEED_BOOST_MULT;
            }

            if (useMouseControl) {
                let dx = mouseX - player.x, dy = mouseY - player.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > CONFIG.MOUSE_DEAD_ZONE) {
                    player.vx += (dx / dist) * accel * dt;
                    player.vy += (dy / dist) * accel * dt;
                }
            } else {
                if (keys['ArrowLeft'] || keys['a']) player.vx -= keyAccel * dt;
                if (keys['ArrowRight'] || keys['d']) player.vx += keyAccel * dt;
                if (keys['ArrowUp'] || keys['w']) player.vy -= keyAccel * dt;
                if (keys['ArrowDown'] || keys['s']) player.vy += keyAccel * dt;
            }

            player.vx *= Math.pow(CONFIG.PLAYER_FRICTION, dt);
            player.vy *= Math.pow(CONFIG.PLAYER_FRICTION, dt);

            let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
            let maxSpeed = player.speed + player.size * CONFIG.PLAYER_SPEED_PER_SIZE;
            if (speedBoostTimer > 0) maxSpeed *= CONFIG.SPEED_BOOST_MULT;
            if (speed > maxSpeed) {
                player.vx = (player.vx / speed) * maxSpeed;
                player.vy = (player.vy / speed) * maxSpeed;
            }

            player.x += player.vx * dt;
            player.y += player.vy * dt;
            player.x = Math.max(player.size, Math.min(W - player.size, player.x));
            player.y = Math.max(player.size, Math.min(H - player.size, player.y));

            if (player.vx > CONFIG.DIR_THRESHOLD) player.direction = 1;
            else if (player.vx < -CONFIG.DIR_THRESHOLD) player.direction = -1;

            // 道具倒计时
            if (shieldTimer > 0) {
                shieldTimer -= dt;
                if (shieldTimer <= 0) {
                    shieldTimer = 0;
                    canvas.classList.remove('shield-border');
                }
            }
            if (speedBoostTimer > 0) { speedBoostTimer -= dt; if (speedBoostTimer < 0) speedBoostTimer = 0; }
            if (magnetTimer > 0) { magnetTimer -= dt; if (magnetTimer < 0) magnetTimer = 0; }
        }

        function updateFishes(dt) {
            for (let i = fishes.length - 1; i >= 0; i--) {
                let fish = fishes[i];
                fish.changeTimer -= dt;
                if (fish.changeTimer <= 0) {
                    fish.changeTimer = CONFIG.FISH_DIR_CHANGE_MIN + Math.random() * (CONFIG.FISH_DIR_CHANGE_MAX - CONFIG.FISH_DIR_CHANGE_MIN);
                    let angle = Math.random() * Math.PI * 2;
                    fish.vx = Math.cos(angle) * fish.speed;
                    fish.vy = Math.sin(angle) * fish.speed;
                }

                let dx = player.x - fish.x, dy = player.y - fish.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < CONFIG.FISH_AI_RANGE && dist > 0) {
                    // 炸弹鱼会主动追击玩家
                    if (fish.type === 'bomb') {
                        fish.vx += (dx / dist) * CONFIG.FISH_CHASE_FORCE * dt * 1.5;
                        fish.vy += (dy / dist) * CONFIG.FISH_CHASE_FORCE * dt * 1.5;
                    } else if (fish.size < player.size * CONFIG.FISH_FLEE_THRESHOLD) {
                        fish.vx -= (dx / dist) * CONFIG.FISH_FLEE_FORCE * dt;
                        fish.vy -= (dy / dist) * CONFIG.FISH_FLEE_FORCE * dt;
                    } else if (fish.size > player.size * CONFIG.FISH_CHASE_THRESHOLD) {
                        fish.vx += (dx / dist) * CONFIG.FISH_CHASE_FORCE * dt;
                        fish.vy += (dy / dist) * CONFIG.FISH_CHASE_FORCE * dt;
                    }
                }

                // 金鱼更灵活地逃跑
                if (fish.type === 'golden' && dist < CONFIG.FISH_AI_RANGE * 1.5) {
                    fish.vx -= (dx / dist) * CONFIG.FISH_FLEE_FORCE * dt * 2;
                    fish.vy -= (dy / dist) * CONFIG.FISH_FLEE_FORCE * dt * 2;
                }

                let fSpeed = Math.sqrt(fish.vx * fish.vx + fish.vy * fish.vy);
                let fishMaxSpeed = fish.speed * CONFIG.FISH_SPEED_LIMIT_MULT;
                if (fSpeed > fishMaxSpeed) {
                    fish.vx = (fish.vx / fSpeed) * fishMaxSpeed;
                    fish.vy = (fish.vy / fSpeed) * fishMaxSpeed;
                }

                fish.x += fish.vx * dt;
                fish.y += fish.vy * dt;

                if (fish.vx > CONFIG.DIR_THRESHOLD) fish.direction = 1;
                else if (fish.vx < -CONFIG.DIR_THRESHOLD) fish.direction = -1;

                let margin = CONFIG.FISH_OFFSCREEN_MARGIN;
                if (fish.x < -margin || fish.x > W + margin || fish.y < -margin || fish.y > H + margin) {
                    fishes.splice(i, 1);
                }
            }

            // 维持鱼群（含鱼群行为）
            let targetCount = CONFIG.FISH_BASE_COUNT + Math.floor(player.size / CONFIG.FISH_PER_SIZE);
            while (fishes.length < targetCount) {
                // 鱼群行为：有一定概率生成一组鱼
                if (Math.random() < CONFIG.SCHOOL_CHANCE) {
                    let schoolPos = {
                        x: Math.random() < 0.5 ? -30 : W + 30,
                        y: Math.random() * H
                    };
                    for (let s = 0; s < CONFIG.SCHOOL_SIZE; s++) {
                        fishes.push(createFish(false, schoolPos));
                    }
                } else {
                    fishes.push(createFish());
                }
            }
        }

        function checkFishCollisions() {
            for (let i = fishes.length - 1; i >= 0; i--) {
                let a = fishes[i];
                if (!a) continue;
                // 炸弹鱼不参与互相吃
                if (a.type === 'bomb') continue;
                for (let j = fishes.length - 1; j >= 0; j--) {
                    if (i === j) continue;
                    let b = fishes[j];
                    if (!b || b.type === 'bomb') continue;
                    let dist = distance(a.x, a.y, b.x, b.y);
                    if (dist < (a.size + b.size) * CONFIG.FISH_AI_COLLISION_FACTOR) {
                        if (a.size > b.size * CONFIG.FISH_AI_EAT_THRESHOLD) {
                            a.size += b.size * CONFIG.FISH_AI_EAT_GROWTH;
                            createEatParticles(b.x, b.y, b.color);
                            fishes.splice(j, 1);
                            if (j < i) i--;
                        }
                    }
                }
            }
        }

        function checkCollisions() {
            for (let i = fishes.length - 1; i >= 0; i--) {
                let fish = fishes[i];
                let dist = distance(player.x, player.y, fish.x, fish.y);
                if (dist < player.size * CONFIG.COLLISION_PLAYER_FACTOR + fish.size * CONFIG.COLLISION_FISH_FACTOR) {
                    // 炸弹鱼 — 无论大小碰到就炸
                    if (fish.type === 'bomb') {
                        if (shieldTimer > 0) {
                            // 护盾可以挡住炸弹
                            shieldTimer = 0;
                            canvas.classList.remove('shield-border');
                            createBombExplosion(fish.x, fish.y);
                            playSound('bomb');
                            scorePopups.push({
                                x: fish.x, y: fish.y,
                                text: '🛡️ 护盾挡住炸弹!',
                                alpha: 1, life: 60, color: '#4fc3f7'
                            });
                            fishes.splice(i, 1);
                        } else {
                            createBombExplosion(fish.x, fish.y);
                            fishes.splice(i, 1);
                            triggerGameOver('💣 你被炸弹鱼炸了！');
                            return;
                        }
                        continue;
                    }

                    if (player.size > fish.size * CONFIG.EAT_THRESHOLD) {
                        onEatFish(fish.size, fish.x, fish.y, fish.type === 'golden');
                        player.size += fish.size * CONFIG.PLAYER_GROWTH_RATE;
                        createEatParticles(fish.x, fish.y, fish.color);
                        fishes.splice(i, 1);
                    } else if (fish.size > player.size * CONFIG.EAT_THRESHOLD) {
                        if (shieldTimer > 0) {
                            // 护盾保护：不会被吃，弹开
                            let dx = player.x - fish.x, dy = player.y - fish.y;
                            let dist2 = Math.sqrt(dx * dx + dy * dy) || 1;
                            player.vx += (dx / dist2) * 5;
                            player.vy += (dy / dist2) * 5;
                            scorePopups.push({
                                x: player.x, y: player.y - 20,
                                text: '🛡️ 护盾保护!',
                                alpha: 1, life: 40, color: '#4fc3f7'
                            });
                        } else {
                            triggerGameOver('你被更大的鱼吃掉了！');
                            return;
                        }
                    }
                }
            }
        }

        function checkPowerupCollisions() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                let dist = distance(player.x, player.y, p.x, p.y);
                if (dist < player.size + p.size) {
                    activatePowerup(p);
                    powerups.splice(i, 1);
                }
            }
        }

        function updateBubbles(dt) {
            if (Math.random() < CONFIG.BUBBLE_SPAWN_CHANCE * dt) bubbles.push(createBubble());
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed * dt;
                b.wobble += 0.02 * dt;
                b.x += Math.sin(b.wobble) * 0.3;
                if (b.y < -10) bubbles.splice(i, 1);
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= CONFIG.PARTICLE_FADE_RATE * dt;
                p.size *= Math.pow(CONFIG.PARTICLE_SHRINK, dt);
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function updatePowerups(dt) {
            // 定时生成道具
            powerupSpawnTimer -= dt;
            if (powerupSpawnTimer <= 0) {
                powerups.push(createPowerup());
                powerupSpawnTimer = CONFIG.POWERUP_SPAWN_INTERVAL;
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                p.y += p.vy * dt;
                p.wobble += 0.03 * dt;
                p.x += Math.sin(p.wobble) * 0.5;
                p.lifetime -= dt;

                // 磁铁效果：吸引小鱼靠近玩家
                if (magnetTimer > 0) {
                    let dx = player.x - p.x, dy = player.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONFIG.MAGNET_RANGE) {
                        p.x += (dx / dist) * CONFIG.MAGNET_FORCE * dt;
                        p.y += (dy / dist) * CONFIG.MAGNET_FORCE * dt;
                    }
                }

                if (p.y > H + 30 || p.lifetime <= 0) powerups.splice(i, 1);
            }
        }

        /** 磁铁效果：吸引小鱼 */
        function applyMagnetEffect(dt) {
            if (magnetTimer <= 0) return;
            for (let fish of fishes) {
                if (fish.type === 'bomb') continue; // 不吸引炸弹鱼
                if (player.size <= fish.size) continue; // 只吸引能吃的鱼
                let dx = player.x - fish.x, dy = player.y - fish.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < CONFIG.MAGNET_RANGE) {
                    fish.vx += (dx / dist) * CONFIG.MAGNET_FORCE * dt;
                    fish.vy += (dy / dist) * CONFIG.MAGNET_FORCE * dt;
                }
            }
        }

        function updateUI() {
            DOM.score.textContent = score;
            DOM.eaten.textContent = fishEaten;
            updateStageDisplay();
            updatePowerupUI();
        }

        // ========== 开始界面 ==========
        function initMenuFishes() {
            menuFishes = [];
            for (let i = 0; i < CONFIG.MENU_FISH_COUNT; i++) menuFishes.push(createFish(true));
        }

        function menuLoop() {
            if (gameState !== 'start') return;
            drawBackground();
            for (let fish of menuFishes) {
                fish.x += fish.vx * 0.5; fish.y += fish.vy * 0.5;
                fish.tailAngle += CONFIG.TAIL_WAGGLE_SPEED;
                if (fish.vx > CONFIG.DIR_THRESHOLD) fish.direction = 1;
                else if (fish.vx < -CONFIG.DIR_THRESHOLD) fish.direction = -1;
                if (fish.x < -60) fish.x = W + 50;
                if (fish.x > W + 60) fish.x = -50;
                if (fish.y < -60) fish.y = H + 50;
                if (fish.y > H + 60) fish.y = -50;
                drawFish(fish, false);
            }
            requestAnimationFrame(menuLoop);
        }

        // ========== 主循环 ==========
        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            if (lastTime === 0) lastTime = timestamp;
            let elapsed = timestamp - lastTime;
            lastTime = timestamp;
            let dt = Math.min(elapsed / CONFIG.TARGET_FRAME_MS, 3);

            updateDifficulty();

            drawBackground();
            for (let fish of fishes) drawSizeIndicator(fish);
            for (let p of powerups) drawPowerup(p);
            for (let b of bubbles) drawBubble(b);
            for (let p of particles) drawParticle(p);
            for (let fish of fishes) drawFish(fish, false);
            drawFish(player, true);

            // 磁铁视觉效果
            if (magnetTimer > 0) {
                ctx.save();
                ctx.globalAlpha = 0.1;
                ctx.beginPath();
                ctx.arc(player.x, player.y, CONFIG.MAGNET_RANGE, 0, Math.PI * 2);
                ctx.strokeStyle = '#ff7043';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.lineDashOffset = -Date.now() / 50;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            drawScorePopups();

            updatePlayer(dt);
            updateFishes(dt);
            applyMagnetEffect(dt);
            checkFishCollisions();
            checkCollisions();
            checkPowerupCollisions();
            updateBubbles(dt);
            updateParticles(dt);
            updatePowerups(dt);
            updateScorePopups(dt);
            updateUI();

            animFrame = requestAnimationFrame(gameLoop);
        }

        // 初始化
        renderStaticBackground();
        initMenuFishes();
        drawBackground();
        menuLoop();
    </script>
</body>
</html>
