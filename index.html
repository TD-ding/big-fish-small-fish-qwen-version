<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大鱼吃小鱼 - Qwen Version</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1628;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer { position: relative; }
        canvas {
            border: 3px solid #1a3a5c;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 100, 200, 0.3);
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #ui div { margin-bottom: 5px; }
        #startScreen, #gameOverScreen, #pauseOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 22, 40, 0.85);
            color: #fff;
            border-radius: 8px;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #4fc3f7;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        #startScreen p, #gameOverScreen p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #b0bec5;
        }
        .btn {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.5);
        }
        #finalScore {
            font-size: 36px;
            color: #ffd54f;
            margin: 10px 0;
        }
        #pauseOverlay h1 {
            font-size: 42px;
            color: #4fc3f7;
        }
        #pauseOverlay p {
            font-size: 18px;
            color: #b0bec5;
            margin-top: 10px;
        }
        .hidden { display: none !important; }
        .tip { font-size: 14px !important; color: #78909c !important; margin-top: 15px !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div>🐟 分数: <span id="score">0</span></div>
            <div>📏 大小: <span id="size">20</span></div>
            <div>🐠 吃掉: <span id="eaten">0</span> 条鱼</div>
            <div>🏆 最高: <span id="highScoreDisplay">0</span></div>
        </div>
        <div id="startScreen">
            <h1>🐟 大鱼吃小鱼 🐟</h1>
            <p>用鼠标/触屏或方向键控制你的鱼</p>
            <p>吃掉比你小的鱼来长大</p>
            <p>躲开比你大的鱼，否则会被吃掉！</p>
            <p style="color:#66bb6a">💚 绿色光晕 = 可以吃</p>
            <p style="color:#ef5350">❤️ 红色光晕 = 危险！快跑</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>游戏结束</h1>
            <p>你被更大的鱼吃掉了！</p>
            <div id="finalScore">0</div>
            <p>最终得分</p>
            <p id="newHighScore" class="hidden" style="color:#ffd54f;font-size:22px">🎉 新纪录！</p>
            <button class="btn" onclick="startGame()">再来一次</button>
        </div>
        <div id="pauseOverlay" class="hidden">
            <h1>⏸️ 暂停中</h1>
            <p>按 P 或 Esc 继续游戏</p>
        </div>
    </div>

    <script>
        // ========== 游戏配置常量 ==========
        // 所有数值集中管理，方便调整游戏平衡
        const CONFIG = {
            // 画布
            CANVAS_W: 900,
            CANVAS_H: 600,
            // 玩家
            PLAYER_INIT_SIZE: 20,
            PLAYER_INIT_SPEED: 3,
            PLAYER_FRICTION: 0.92,
            PLAYER_ACCEL_MOUSE: 0.3,
            PLAYER_ACCEL_KEY: 0.4,
            PLAYER_GROWTH_RATE: 0.05,
            PLAYER_SPEED_PER_SIZE: 0.02,
            // 碰撞
            EAT_THRESHOLD: 1.1,
            COLLISION_PLAYER_FACTOR: 0.7,
            COLLISION_FISH_FACTOR: 0.5,
            // AI鱼群
            FISH_BASE_COUNT: 15,
            FISH_PER_SIZE: 5,
            FISH_INIT_COUNT: 20,
            FISH_SPEED_MIN: 0.5,
            FISH_SPEED_MAX: 2.5,
            FISH_SPEED_LIMIT_MULT: 2,
            FISH_BIG_SLOW_MULT: 0.7,
            FISH_BIG_SLOW_THRESHOLD: 1.5,
            FISH_SMALL_RATIO: 0.5,
            FISH_SIMILAR_RATIO: 0.85,
            FISH_DIR_CHANGE_MIN: 100,
            FISH_DIR_CHANGE_MAX: 300,
            FISH_AI_RANGE: 150,
            FISH_FLEE_FORCE: 0.15,
            FISH_CHASE_FORCE: 0.08,
            FISH_FLEE_THRESHOLD: 0.8,
            FISH_CHASE_THRESHOLD: 1.2,
            FISH_OFFSCREEN_MARGIN: 100,
            FISH_MIN_SIZE: 5,
            FISH_SMALL_SIZE_MIN: 0.2,
            FISH_SMALL_SIZE_MAX: 0.9,
            FISH_SIMILAR_SIZE_MIN: 0.8,
            FISH_SIMILAR_SIZE_MAX: 1.2,
            FISH_BIG_SIZE_MIN: 1.2,
            FISH_BIG_SIZE_MAX: 2.0,
            // 分数
            SCORE_PER_SIZE: 10,
            // 气泡
            BUBBLE_SPAWN_CHANCE: 0.02,
            BUBBLE_SIZE_MIN: 2,
            BUBBLE_SIZE_RANGE: 5,
            BUBBLE_SPEED_MIN: 0.3,
            BUBBLE_SPEED_RANGE: 0.7,
            // 粒子
            EAT_PARTICLE_COUNT: 8,
            PARTICLE_FADE_RATE: 0.02,
            PARTICLE_SHRINK: 0.98,
            PARTICLE_SIZE_MIN: 2,
            PARTICLE_SIZE_RANGE: 3,
            PARTICLE_SPEED_RANGE: 2,
            // 视觉提示
            SIZE_INDICATOR_RANGE: 250,
            INDICATOR_GREEN: 'rgba(102, 187, 106, 0.25)',
            INDICATOR_RED: 'rgba(239, 83, 80, 0.25)',
            // 帧率
            TARGET_FRAME_MS: 1000 / 60,
            // 尾摆速度
            TAIL_WAGGLE_SPEED: 0.1,
            TAIL_WAGGLE_AMP: 0.3,
            // 海藻
            SEAWEED_COUNT: 8,
            SEAWEED_SPACING: 120,
            SEAWEED_START_X: 60,
            SEAWEED_SEGMENTS: 5,
            SEAWEED_SEG_HEIGHT: 30,
            // 光线
            LIGHT_RAY_COUNT: 5,
            LIGHT_RAY_SPACING: 180,
            LIGHT_RAY_START: 150,
            LIGHT_RAY_OFFSET: 50
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = CONFIG.CANVAS_W;
        const H = CONFIG.CANVAS_H;

        // 缓存DOM引用
        const DOM = {
            score: document.getElementById('score'),
            size: document.getElementById('size'),
            eaten: document.getElementById('eaten'),
            finalScore: document.getElementById('finalScore'),
            highScoreDisplay: document.getElementById('highScoreDisplay'),
            startScreen: document.getElementById('startScreen'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            pauseOverlay: document.getElementById('pauseOverlay'),
            newHighScore: document.getElementById('newHighScore')
        };

        // ========== 游戏状态 ==========
        let gameState = 'start'; // start | playing | paused | over
        let score = 0;
        let fishEaten = 0;
        let highScore = parseInt(localStorage.getItem('bigFishHighScore')) || 0;
        let animFrame;
        let lastTime = 0;
        DOM.highScoreDisplay.textContent = highScore;

        // 玩家
        let player = {
            x: W / 2, y: H / 2,
            size: CONFIG.PLAYER_INIT_SIZE,
            speed: CONFIG.PLAYER_INIT_SPEED,
            vx: 0, vy: 0,
            color: '#4fc3f7',
            tailAngle: 0,
            direction: 1
        };

        let fishes = [];
        let bubbles = [];
        let particles = [];

        // 输入
        let keys = {};
        let mouseX = W / 2;
        let mouseY = H / 2;
        let useMouseControl = false;

        // 鱼的配色方案
        const fishColors = [
            '#ff7043', '#ff8a65', '#ffab91',
            '#66bb6a', '#81c784', '#a5d6a7',
            '#ffa726', '#ffb74d', '#ffcc80',
            '#ef5350', '#e57373', '#ef9a9a',
            '#ab47bc', '#ba68c8', '#ce93d8',
            '#42a5f5', '#64b5f6', '#90caf9',
            '#ffee58', '#fff176', '#fff59d',
        ];

        // ========== 输入事件 ==========
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            useMouseControl = false;
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (gameState === 'playing') pauseGame();
                else if (gameState === 'paused') resumeGame();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (W / rect.width);
            mouseY = (e.clientY - rect.top) * (H / rect.height);
            useMouseControl = true;
        });

        // 触控支持
        function handleTouch(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                mouseX = (touch.clientX - rect.left) * (W / rect.width);
                mouseY = (touch.clientY - rect.top) * (H / rect.height);
                useMouseControl = true;
            }
        }
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        // ========== 暂停/恢复 ==========
        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            DOM.pauseOverlay.classList.remove('hidden');
            if (animFrame) cancelAnimationFrame(animFrame);
        }

        function resumeGame() {
            if (gameState !== 'paused') return;
            gameState = 'playing';
            DOM.pauseOverlay.classList.add('hidden');
            lastTime = performance.now();
            animFrame = requestAnimationFrame(gameLoop);
        }

        // ========== 创建鱼 ==========
        function createFish() {
            let size;
            let rand = Math.random();
            if (rand < CONFIG.FISH_SMALL_RATIO) {
                size = Math.max(CONFIG.FISH_MIN_SIZE,
                    player.size * (CONFIG.FISH_SMALL_SIZE_MIN + Math.random() * (CONFIG.FISH_SMALL_SIZE_MAX - CONFIG.FISH_SMALL_SIZE_MIN)));
            } else if (rand < CONFIG.FISH_SIMILAR_RATIO) {
                size = player.size * (CONFIG.FISH_SIMILAR_SIZE_MIN + Math.random() * (CONFIG.FISH_SIMILAR_SIZE_MAX - CONFIG.FISH_SIMILAR_SIZE_MIN));
            } else {
                size = player.size * (CONFIG.FISH_BIG_SIZE_MIN + Math.random() * (CONFIG.FISH_BIG_SIZE_MAX - CONFIG.FISH_BIG_SIZE_MIN));
            }

            let x, y;
            let side = Math.floor(Math.random() * 4);
            if (side === 0) { x = -size; y = Math.random() * H; }
            else if (side === 1) { x = W + size; y = Math.random() * H; }
            else if (side === 2) { x = Math.random() * W; y = -size; }
            else { x = Math.random() * W; y = H + size; }

            let speed = CONFIG.FISH_SPEED_MIN + Math.random() * (CONFIG.FISH_SPEED_MAX - CONFIG.FISH_SPEED_MIN);
            if (size > player.size * CONFIG.FISH_BIG_SLOW_THRESHOLD) speed *= CONFIG.FISH_BIG_SLOW_MULT;

            let dirX = (W / 2 - x) + (Math.random() - 0.5) * W;
            let dirY = (H / 2 - y) + (Math.random() - 0.5) * H;
            let len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;

            return {
                x, y, size, speed,
                vx: (dirX / len) * speed,
                vy: (dirY / len) * speed,
                color: fishColors[Math.floor(Math.random() * fishColors.length)],
                tailAngle: Math.random() * Math.PI * 2,
                direction: dirX > 0 ? 1 : -1,
                changeTimer: CONFIG.FISH_DIR_CHANGE_MIN + Math.random() * (CONFIG.FISH_DIR_CHANGE_MAX - CONFIG.FISH_DIR_CHANGE_MIN)
            };
        }

        function createBubble() {
            return {
                x: Math.random() * W,
                y: H + 10,
                size: CONFIG.BUBBLE_SIZE_MIN + Math.random() * CONFIG.BUBBLE_SIZE_RANGE,
                speed: CONFIG.BUBBLE_SPEED_MIN + Math.random() * CONFIG.BUBBLE_SPEED_RANGE,
                wobble: Math.random() * Math.PI * 2
            };
        }

        // ========== 绘制函数 ==========
        function drawFish(fish, isPlayer) {
            ctx.save();
            ctx.translate(fish.x, fish.y);
            ctx.scale(fish.direction, 1);

            let s = fish.size;

            // 尾摆动画
            fish.tailAngle += CONFIG.TAIL_WAGGLE_SPEED;
            let tailSwing = Math.sin(fish.tailAngle) * CONFIG.TAIL_WAGGLE_AMP;

            // 身体
            ctx.beginPath();
            ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = fish.color;
            ctx.fill();

            // 渐变叠加
            let grad = ctx.createRadialGradient(-s * 0.2, -s * 0.2, 0, 0, 0, s);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fill();

            // 尾巴
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, 0);
            ctx.lineTo(-s * 1.4, -s * 0.5 + tailSwing * s);
            ctx.lineTo(-s * 1.4, s * 0.5 + tailSwing * s);
            ctx.closePath();
            ctx.fillStyle = fish.color;
            ctx.fill();

            // 背鳍
            ctx.beginPath();
            ctx.moveTo(-s * 0.2, -s * 0.5);
            ctx.quadraticCurveTo(s * 0.1, -s * 0.9, s * 0.3, -s * 0.5);
            ctx.fillStyle = fish.color;
            ctx.globalAlpha = 0.7;
            ctx.fill();
            ctx.globalAlpha = 1;

            // 眼睛
            ctx.beginPath();
            ctx.arc(s * 0.4, -s * 0.1, s * 0.18, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.45, -s * 0.1, s * 0.09, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(s * 0.47, -s * 0.14, s * 0.04, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // 玩家标记
            if (isPlayer) {
                ctx.beginPath();
                ctx.arc(0, -s * 0.9, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd54f';
                ctx.fill();
            }

            ctx.restore();
        }

        // 大小对比指示器：绿色=可吃，红色=危险
        function drawSizeIndicator(fish) {
            let dx = fish.x - player.x;
            let dy = fish.y - player.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > CONFIG.SIZE_INDICATOR_RANGE) return;

            let alpha = 1 - (dist / CONFIG.SIZE_INDICATOR_RANGE);
            let indicatorColor;
            if (player.size > fish.size * CONFIG.EAT_THRESHOLD) {
                indicatorColor = CONFIG.INDICATOR_GREEN;
            } else if (fish.size > player.size * CONFIG.EAT_THRESHOLD) {
                indicatorColor = CONFIG.INDICATOR_RED;
            } else {
                return; // 大小相近不显示
            }

            ctx.save();
            ctx.globalAlpha = alpha * 0.6;
            ctx.beginPath();
            ctx.arc(fish.x, fish.y, fish.size + 4, 0, Math.PI * 2);
            ctx.strokeStyle = indicatorColor.replace(/[\d.]+\)$/, '0.8)');
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = indicatorColor;
            ctx.fill();
            ctx.restore();
        }

        function drawBubble(bubble) {
            ctx.beginPath();
            ctx.arc(bubble.x, bubble.y, bubble.size, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(bubble.x - bubble.size * 0.3, bubble.y - bubble.size * 0.3, bubble.size * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
        }

        function drawParticle(p) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
            ctx.fill();
        }

        function drawBackground() {
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0d2137');
            grad.addColorStop(0.5, '#0a3d5c');
            grad.addColorStop(1, '#062a3e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 光线
            ctx.save();
            ctx.globalAlpha = 0.03;
            for (let i = 0; i < CONFIG.LIGHT_RAY_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(CONFIG.LIGHT_RAY_START + i * CONFIG.LIGHT_RAY_SPACING, 0);
                ctx.lineTo(CONFIG.LIGHT_RAY_START - CONFIG.LIGHT_RAY_OFFSET + i * CONFIG.LIGHT_RAY_SPACING, H);
                ctx.lineTo(CONFIG.LIGHT_RAY_START + CONFIG.LIGHT_RAY_OFFSET + i * CONFIG.LIGHT_RAY_SPACING, H);
                ctx.closePath();
                ctx.fillStyle = '#4fc3f7';
                ctx.fill();
            }
            ctx.restore();

            // 海藻
            ctx.save();
            ctx.globalAlpha = 0.15;
            let time = Date.now() / 1000;
            for (let i = 0; i < CONFIG.SEAWEED_COUNT; i++) {
                let baseX = CONFIG.SEAWEED_START_X + i * CONFIG.SEAWEED_SPACING;
                ctx.beginPath();
                ctx.moveTo(baseX, H);
                for (let j = 0; j < CONFIG.SEAWEED_SEGMENTS; j++) {
                    let y = H - j * CONFIG.SEAWEED_SEG_HEIGHT;
                    let x = baseX + Math.sin(time + i + j * 0.5) * 10;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            ctx.restore();
        }

        function createEatParticles(x, y, color) {
            let r = parseInt(color.substr(1, 2), 16);
            let g = parseInt(color.substr(3, 2), 16);
            let b = parseInt(color.substr(5, 2), 16);
            for (let i = 0; i < CONFIG.EAT_PARTICLE_COUNT; i++) {
                let angle = (Math.PI * 2 / CONFIG.EAT_PARTICLE_COUNT) * i;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * (1 + Math.random() * CONFIG.PARTICLE_SPEED_RANGE),
                    vy: Math.sin(angle) * (1 + Math.random() * CONFIG.PARTICLE_SPEED_RANGE),
                    size: CONFIG.PARTICLE_SIZE_MIN + Math.random() * CONFIG.PARTICLE_SIZE_RANGE,
                    alpha: 1, r, g, b
                });
            }
        }

        // ========== 更新函数（帧率无关） ==========
        // dt = 时间因子，1.0 表示在60fps下一帧的标准时间
        function updatePlayer(dt) {
            if (useMouseControl) {
                let dx = mouseX - player.x;
                let dy = mouseY - player.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 5) {
                    player.vx += (dx / dist) * CONFIG.PLAYER_ACCEL_MOUSE * dt;
                    player.vy += (dy / dist) * CONFIG.PLAYER_ACCEL_MOUSE * dt;
                }
            } else {
                if (keys['ArrowLeft'] || keys['a']) player.vx -= CONFIG.PLAYER_ACCEL_KEY * dt;
                if (keys['ArrowRight'] || keys['d']) player.vx += CONFIG.PLAYER_ACCEL_KEY * dt;
                if (keys['ArrowUp'] || keys['w']) player.vy -= CONFIG.PLAYER_ACCEL_KEY * dt;
                if (keys['ArrowDown'] || keys['s']) player.vy += CONFIG.PLAYER_ACCEL_KEY * dt;
            }

            // 摩擦（按帧率调整）
            let friction = Math.pow(CONFIG.PLAYER_FRICTION, dt);
            player.vx *= friction;
            player.vy *= friction;

            // 限速
            let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
            let maxSpeed = player.speed + player.size * CONFIG.PLAYER_SPEED_PER_SIZE;
            if (speed > maxSpeed) {
                player.vx = (player.vx / speed) * maxSpeed;
                player.vy = (player.vy / speed) * maxSpeed;
            }

            player.x += player.vx * dt;
            player.y += player.vy * dt;

            // 边界
            player.x = Math.max(player.size, Math.min(W - player.size, player.x));
            player.y = Math.max(player.size, Math.min(H - player.size, player.y));

            // 朝向
            if (player.vx > 0.1) player.direction = 1;
            else if (player.vx < -0.1) player.direction = -1;
        }

        function updateFishes(dt) {
            for (let i = fishes.length - 1; i >= 0; i--) {
                let fish = fishes[i];

                // 改变方向
                fish.changeTimer -= dt;
                if (fish.changeTimer <= 0) {
                    fish.changeTimer = CONFIG.FISH_DIR_CHANGE_MIN + Math.random() * (CONFIG.FISH_DIR_CHANGE_MAX - CONFIG.FISH_DIR_CHANGE_MIN);
                    let angle = Math.random() * Math.PI * 2;
                    fish.vx = Math.cos(angle) * fish.speed;
                    fish.vy = Math.sin(angle) * fish.speed;
                }

                // AI行为
                let dx = player.x - fish.x;
                let dy = player.y - fish.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < CONFIG.FISH_AI_RANGE && dist > 0) {
                    if (fish.size < player.size * CONFIG.FISH_FLEE_THRESHOLD) {
                        fish.vx -= (dx / dist) * CONFIG.FISH_FLEE_FORCE * dt;
                        fish.vy -= (dy / dist) * CONFIG.FISH_FLEE_FORCE * dt;
                    } else if (fish.size > player.size * CONFIG.FISH_CHASE_THRESHOLD) {
                        fish.vx += (dx / dist) * CONFIG.FISH_CHASE_FORCE * dt;
                        fish.vy += (dy / dist) * CONFIG.FISH_CHASE_FORCE * dt;
                    }
                }

                // 限速
                let fSpeed = Math.sqrt(fish.vx * fish.vx + fish.vy * fish.vy);
                let fishMaxSpeed = fish.speed * CONFIG.FISH_SPEED_LIMIT_MULT;
                if (fSpeed > fishMaxSpeed) {
                    fish.vx = (fish.vx / fSpeed) * fishMaxSpeed;
                    fish.vy = (fish.vy / fSpeed) * fishMaxSpeed;
                }

                fish.x += fish.vx * dt;
                fish.y += fish.vy * dt;

                if (fish.vx > 0.1) fish.direction = 1;
                else if (fish.vx < -0.1) fish.direction = -1;

                // 移出屏幕
                let margin = CONFIG.FISH_OFFSCREEN_MARGIN;
                if (fish.x < -margin || fish.x > W + margin || fish.y < -margin || fish.y > H + margin) {
                    fishes.splice(i, 1);
                }
            }

            // 维持鱼群数量
            let targetCount = CONFIG.FISH_BASE_COUNT + Math.floor(player.size / CONFIG.FISH_PER_SIZE);
            while (fishes.length < targetCount) {
                fishes.push(createFish());
            }
        }

        function checkCollisions() {
            for (let i = fishes.length - 1; i >= 0; i--) {
                let fish = fishes[i];
                let dx = player.x - fish.x;
                let dy = player.y - fish.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.size * CONFIG.COLLISION_PLAYER_FACTOR + fish.size * CONFIG.COLLISION_FISH_FACTOR) {
                    if (player.size > fish.size * CONFIG.EAT_THRESHOLD) {
                        // 吃掉小鱼
                        score += Math.floor(fish.size * CONFIG.SCORE_PER_SIZE);
                        fishEaten++;
                        player.size += fish.size * CONFIG.PLAYER_GROWTH_RATE;
                        createEatParticles(fish.x, fish.y, fish.color);
                        fishes.splice(i, 1);
                    } else if (fish.size > player.size * CONFIG.EAT_THRESHOLD) {
                        // 被大鱼吃掉 — 游戏结束
                        gameState = 'over';
                        endGame();
                        return;
                    }
                }
            }
        }

        function updateBubbles(dt) {
            if (Math.random() < CONFIG.BUBBLE_SPAWN_CHANCE * dt) {
                bubbles.push(createBubble());
            }
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed * dt;
                b.wobble += 0.02 * dt;
                b.x += Math.sin(b.wobble) * 0.3;
                if (b.y < -10) bubbles.splice(i, 1);
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= CONFIG.PARTICLE_FADE_RATE * dt;
                p.size *= Math.pow(CONFIG.PARTICLE_SHRINK, dt);
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function updateUI() {
            DOM.score.textContent = score;
            DOM.size.textContent = Math.floor(player.size);
            DOM.eaten.textContent = fishEaten;
        }

        // ========== 游戏结束处理 ==========
        function endGame() {
            DOM.finalScore.textContent = score;
            DOM.gameOverScreen.classList.remove('hidden');

            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bigFishHighScore', highScore);
                DOM.highScoreDisplay.textContent = highScore;
                DOM.newHighScore.classList.remove('hidden');
            } else {
                DOM.newHighScore.classList.add('hidden');
            }
        }

        // ========== 游戏主循环 ==========
        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            // 计算帧率无关的时间因子 dt
            if (lastTime === 0) lastTime = timestamp;
            let elapsed = timestamp - lastTime;
            lastTime = timestamp;
            // dt = 1.0 在60fps时，0.5 在120fps时，2.0 在30fps时
            let dt = Math.min(elapsed / CONFIG.TARGET_FRAME_MS, 3); // 限制最大dt防止跳帧

            drawBackground();

            // 先绘制大小指示器（在鱼的下方）
            for (let fish of fishes) drawSizeIndicator(fish);

            for (let b of bubbles) drawBubble(b);
            for (let p of particles) drawParticle(p);
            for (let fish of fishes) drawFish(fish, false);
            drawFish(player, true);

            // 更新
            updatePlayer(dt);
            updateFishes(dt);
            checkCollisions();
            updateBubbles(dt);
            updateParticles(dt);
            updateUI();

            animFrame = requestAnimationFrame(gameLoop);
        }

        // ========== 开始游戏 ==========
        function startGame() {
            score = 0;
            fishEaten = 0;
            fishes = [];
            bubbles = [];
            particles = [];

            player.x = W / 2;
            player.y = H / 2;
            player.size = CONFIG.PLAYER_INIT_SIZE;
            player.speed = CONFIG.PLAYER_INIT_SPEED;
            player.vx = 0;
            player.vy = 0;

            for (let i = 0; i < CONFIG.FISH_INIT_COUNT; i++) {
                fishes.push(createFish());
            }

            gameState = 'playing';
            lastTime = 0;
            DOM.startScreen.classList.add('hidden');
            DOM.gameOverScreen.classList.add('hidden');
            DOM.pauseOverlay.classList.add('hidden');

            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = requestAnimationFrame(gameLoop);
        }

        // 初始背景
        drawBackground();
    </script>
</body>
</html>
